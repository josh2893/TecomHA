name: Validate

# Runs on pushes to main, on pull requests, and weekly. Home Assistant and HACS
# both move, so the scheduled run catches a rule that changed without anything
# in this repository changing.
#
# Documentation-only edits are excluded: they cannot break hassfest or the
# project checks, and running the full suite on every README tweak trains you
# to ignore the result.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  checks:
    name: Project checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        # Declared in one place so CI and local development stay in step.
        run: pip install -r requirements-test.txt

      - name: Ground-truth protocol tests
        run: python3 -m pytest tests/ -q

      - name: Project checks
        run: python3 tools/validate_project.py
